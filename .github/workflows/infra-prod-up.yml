name: Production - Bootstrap EKS CD Stack

on:
  workflow_dispatch:

concurrency:
  group: prod-infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Apply Terraform and Bootstrap Prod CD Stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME_PROD || 'banking-ms-prod' }}
      GITOPS_ROOT_APP: https://raw.githubusercontent.com/LeDangQuocAn/banking-gitops/production/argocd/prod/root/root-application.yaml
      GITOPS_PROJECT: https://raw.githubusercontent.com/LeDangQuocAn/banking-gitops/production/argocd/prod/project/appproject.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_INFRA_OIDC }}
          role-session-name: infra-prod-up-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Terraform apply production foundation
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -euo pipefail
          terraform -chdir=terraform/environments/prod init -input=false
          terraform -chdir=terraform/environments/prod apply \
            -var-file=prod.tfvars \
            -auto-approve \
            -input=false

      - name: Load production Terraform outputs
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -euo pipefail
          ALB_ROLE_ARN=$(terraform -chdir=terraform/environments/prod output -raw irsa_alb_controller_role_arn)
          ESO_ROLE_ARN=$(terraform -chdir=terraform/environments/prod output -raw irsa_external_secrets_role_arn)
          GITHUB_DEPLOY_ROLE_ARN=$(terraform -chdir=terraform/environments/prod output -raw irsa_github_deploy_role_arn)

          {
            echo "ALB_ROLE_ARN=$ALB_ROLE_ARN"
            echo "ESO_ROLE_ARN=$ESO_ROLE_ARN"
            echo "GITHUB_DEPLOY_ROLE_ARN=$GITHUB_DEPLOY_ROLE_ARN"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials for EKS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          role-session-name: infra-prod-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Wait for EKS nodes to be Ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=600s
          kubectl get nodes -o wide

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts --force-update
          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN" \
            --wait --timeout=5m
          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system --timeout=180s

      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io --force-update
          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --namespace external-secrets --create-namespace \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ESO_ROLE_ARN" \
            --set webhook.create=false \
            --set certController.create=false \
            --wait --timeout=8m

      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --wait --timeout=10m

      - name: Apply production AppProject and Root Application
        run: |
          kubectl apply -f "$GITOPS_PROJECT"
          kubectl apply -f "$GITOPS_ROOT_APP"
          kubectl get applications -n argocd

      - name: Print production bootstrap summary
        if: always()
        run: |
          echo "--- Nodes ---"
          kubectl get nodes -o wide 2>/dev/null || true
          echo "--- CD Components ---"
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller 2>/dev/null || true
          kubectl get pods -n external-secrets 2>/dev/null || true
          kubectl get pods -n argocd 2>/dev/null || true
          echo "--- ArgoCD Applications ---"
          kubectl get applications -n argocd 2>/dev/null || true
