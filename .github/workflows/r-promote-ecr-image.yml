name: Reusable Promote ECR Image

on:
  workflow_call:
    inputs:
      services_matrix:
        description: 'JSON array of services to promote'
        required: true
        type: string
      source_environment:
        description: 'Source ECR environment name'
        required: true
        type: string
      target_environment:
        description: 'Target ECR environment name'
        required: true
        type: string
      source_image_tag:
        description: 'Image tag to copy from source to target'
        required: true
        type: string
    secrets:
      ECR_OIDC:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  promote-ecr-image:
    name: Promote Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_OIDC }}
          role-session-name: github-actions-promote-ecr
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote image tag into target ECR repository
        env:
          REPO_PREFIX_RAW: ${{ vars.ECR_REPOSITORY_PREFIX || 'banking-microservices' }}
          SOURCE_ENV_RAW: ${{ inputs.source_environment }}
          TARGET_ENV_RAW: ${{ inputs.target_environment }}
          SOURCE_IMAGE_TAG: ${{ inputs.source_image_tag }}
        run: |
          set -euo pipefail

          sanitize() {
            printf '%s' "$1" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]'
          }

          repo_prefix="$(sanitize "$REPO_PREFIX_RAW")"
          source_env="$(sanitize "$SOURCE_ENV_RAW")"
          target_env="$(sanitize "$TARGET_ENV_RAW")"
          service_name="$(sanitize "${{ matrix.service }}")"

          source_repo="${repo_prefix}-${source_env}-${service_name}"
          target_repo="${repo_prefix}-${target_env}-${service_name}"

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          SOURCE_URI="${REGISTRY}/${source_repo}:${SOURCE_IMAGE_TAG}"
          TARGET_URI="${REGISTRY}/${target_repo}:${SOURCE_IMAGE_TAG}"

          echo "Promoting image from Staging to Production..."
          echo "Source: $SOURCE_URI"
          echo "Target: $TARGET_URI"

          docker buildx imagetools create -t "$TARGET_URI" "$SOURCE_URI"

          echo "Promotion successful for ${target_repo}!"
